# The status service's own tests, with its own dependencies (command-center/D30). The root `check` stays standard
# library only and does not run these. The service derives with plugin/skills/loop-status/scripts/loop_status.py
# from the same commit and checks its manifest with scripts/gcp/manifest.py, so it runs on every push and pull
# request, as the runner's does: CI on main's head always says whether the service still works with the
# derivation and the manifest format on main.
name: status-service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/status
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/status/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
